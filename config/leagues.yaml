  - {id: 119, name: "Superliga",                country: Denmark,     priority: 2, season_type: split}
  - {id: 136, name: "Serie B",                  country: Italy,       priority: 2, season_type: split}
  - {id: 80,  name: "3. Liga",                  country: Germany,     priority: 2, season_type: split}

  # --- Oncelik 3: genisleme ------------------------------------------------
