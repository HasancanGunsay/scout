# Hedef ligler - oncelik sirali.
#
# Oncelik mantigi (wonderkid avi):
#   1. Yetenek ihracati yuksek + gence dakika veren ligler
#   2. Kullanicinin acikca belirttigi ligler (Brezilya, Ligue 1/2, Serie B, Kuzey)
#   3. Dusuk gorunurluk = piyasa henuz kesfetmemis
#
# Big-5 birinci ligler bilincli olarak DUSUK oncelikli: oradaki yetenekler
# zaten hizla yayiliyor, sistemin katma degeri dusuk. Yine de lig gucu
# modelinin (§5.2) referans noktasi olarak gerekliler.
#
# season_type: calendar = takvim yili (2024 = 2024 sezonu)
#              split    = 2024 -> 2024/25 sezonu
#
# NOT: Ucretsiz plan yalnizca 2022-2024 sezonlarina eriyor.

# Sira onemli: once 2024 (en guncel), sonra 2022.
# 2022+2024 cifti geriye donuk testin (§8) tam ihtiyaci: 2022'de U21 listesi uret,
# 2024'te kimin gercekten sicradigina bak. 2023 en son gelir (araya dolgu).
seasons: [2024, 2022, 2023]

leagues:
  # --- Oncelik 1: cekirdek wonderkid pazarlari -----------------------------
  - {id: 72,  name: "Brasileirao Serie B",      country: Brazil,      priority: 1, season_type: calendar}
  - {id: 71,  name: "Brasileirao Serie A",      country: Brazil,      priority: 1, season_type: calendar}
  - {id: 89,  name: "Eerste Divisie",           country: Netherlands, priority: 1, season_type: split}
  - {id: 62,  name: "Ligue 2",                  country: France,      priority: 1, season_type: split}
  - {id: 128, name: "Liga Profesional",         country: Argentina,   priority: 1, season_type: calendar}

